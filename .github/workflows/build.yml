name: build-and-deploy

on:
  schedule:
    - cron: "41 12 * * *"   # daily ~07:41 America/Chicago; after civic-watch's run
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write       # push data/meetings.json to the `data` branch (tools/data_branch.sh)
  pages: write
  id-token: write

concurrency:
  group: mmwatch-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      # The meeting store is the site's memory. `main` is PR-protected, so the
      # store lives on the unprotected `data` branch (issue #4): overlay it
      # before the build, push it back after. The copy on `main` is the seed.
      - name: Restore meeting store
        run: tools/data_branch.sh restore

      # Reads one PUBLIC MEETINGS digest (see mmwatch/sources.py for why one).
      # A source outage degrades to a rebuild from stored data rather than an
      # empty site.
      - name: Build site
        env:
          MMWATCH_MAILCHIMP_ACTION: ${{ secrets.MMWATCH_MAILCHIMP_ACTION }}
          MMWATCH_MAILCHIMP_HONEYPOT: ${{ secrets.MMWATCH_MAILCHIMP_HONEYPOT }}
        run: python -m mmwatch.build

      # Quiet days push nothing: persist compares content with generated_at
      # ignored. A failure here fails the job on purpose -- a store that
      # silently stops accumulating is worse than one missed deploy, and the
      # side branch takes the stock GITHUB_TOKEN, so failures are transient.
      - name: Persist meeting store
        run: tools/data_branch.sh persist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
